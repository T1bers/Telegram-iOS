name: CI

on:
  push:
    branches: [ master, ayugram-developer-badge ]

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          set -e
          XCODE_VERSION=$(python3 -c 'import json;print(json.load(open("versions.json"))["xcode"])')
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"

          echo "Requested Xcode: $XCODE_VERSION"
          echo "Installed Xcode versions:"
          ls -d /Applications/Xcode* || true

          if [ ! -d "$XCODE_APP" ]; then
            echo "WARNING: $XCODE_APP not found, trying the newest Xcode 26.x"
            XCODE_APP=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          fi

          if [ -z "$XCODE_APP" ] || [ ! -d "$XCODE_APP" ]; then
            echo "ERROR: no suitable Xcode found on this runner"
            exit 1
          fi

          echo "Using: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/
          mv "/Users/Shared/$(basename "$GITHUB_WORKSPACE")" /Users/Shared/telegram-ios

      - name: Build the App
        run: |
          set -e
          set -x

          SOURCE_DIR=/Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          echo "===== BUILD WITHOUT EMBEDDED PROVISIONING PROFILES ====="

          echo "===== START BAZEL BUILD ====="

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"

          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          cp bazel-bin/Telegram/Telegram.ipa "$OUTPUT_PATH/"

          mkdir -p build/DSYMs

          for f in bazel-bin/Telegram/*.dSYM; do
            cp -R "$f" build/DSYMs/
          done

          zip -r "./$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs 1>/dev/null

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          target_commitish: ${{ github.sha }}
          body: |
            An unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
