name: CI

on:
  push:
    branches:
      - master
      - ayugram-developer-badge
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set active Xcode path
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_APP="/Applications/Xcode_${XCODE_VERSION}.app"
          if [[ ! -d "$XCODE_APP" ]]; then
            XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          fi
          if [[ -z "$XCODE_APP" || ! -d "$XCODE_APP" ]]; then
            echo "No suitable Xcode installation found"
            exit 1
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Create canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios

      - name: Build unsigned IPA for sideloading
        shell: bash
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --disableProvisioningProfiles \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          mkdir -p "$OUTPUT_PATH" build/DSYMs
          cp bazel-bin/Telegram/Telegram.ipa "$OUTPUT_PATH/Telegram.ipa"

          if unzip -Z1 "$OUTPUT_PATH/Telegram.ipa" | grep -q 'embedded.mobileprovision'; then
            echo "Provisioning profile unexpectedly embedded in IPA"
            exit 1
          fi
          if ! unzip -Z1 "$OUTPUT_PATH/Telegram.ipa" | grep -qE '^Payload/[^/]+\.app/'; then
            echo "IPA payload is missing"
            exit 1
          fi
          echo "IPA verification passed"

          for f in bazel-bin/Telegram/*.dSYM; do
            if [[ -e "$f" ]]; then
              cp -R "$f" build/DSYMs/
            fi
          done
          zip -qr "$OUTPUT_PATH/Telegram.DSYMs.zip" build/DSYMs

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
          if-no-files-found: error

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.BUILD_NUMBER }}
          name: Telegram ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }})
          target_commitish: ${{ github.sha }}
          body: |
            Unsigned build of Telegram for iOS ${{ env.APP_VERSION }} (${{ env.BUILD_NUMBER }}).
            Sign the IPA on your device before installing.
          draft: false
          prerelease: false
          files: |
            /Users/Shared/telegram-ios/build/artifacts/Telegram.ipa
            /Users/Shared/telegram-ios/build/artifacts/Telegram.DSYMs.zip
